name: Java CI/CD with Gradle & Docker

on:
  push:
    branches: [ "main", "week4-security-찬섭" ]


# 깃허브 Secrets에 정의된 값을 안전하게 워크플로우 내부 'env' 변수로 선언합니다.
env:
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  HOST: ${{ secrets.HOST }}
  USERNAME: ${{ secrets.USERNAME }}
  SSH_KEY: ${{ secrets.SSH_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # ⚡ [중요] 모든 run 명령어가 실제 프로젝트 폴더인 'demo' 디렉토리 내부에서 기본 실행되도록 설정합니다.
    defaults:
      run:
        working-directory: ./demo
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    # 빌드 전, application-secret.properties 복원/생성 (demo/src/main/resources에 생성됨)
    - name: Make application-secret.properties
      run: |
        mkdir -p src/main/resources
        cat <<EOF > src/main/resources/application-secret.properties
        spring.datasource.url=jdbc:mysql://$DB_HOST:3306/board?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
        spring.datasource.username=$DB_USERNAME
        spring.datasource.password=$DB_PASSWORD
        jwt.secret=$JWT_SECRET
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    # Docker Image 빌드를 위해 Docker Hub 로그인
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    # Docker 이미지 빌드 및 푸시
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./demo # ⚡ Docker 빌드 컨텍스트를 demo 폴더로 지정합니다.
        push: true
        tags: ${{ env.DOCKER_USERNAME }}/demo-app:latest

    # SSH를 통해 EC2 접속 후 Docker Image Pull 및 실행
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.HOST }}
        username: ${{ env.USERNAME }}
        key: ${{ env.SSH_KEY }}
        script: |
          # Docker Hub 로그인 (프라이빗 이미지인 경우 대비)
          echo "${{ env.DOCKER_PASSWORD }}" | docker login -u "${{ env.DOCKER_USERNAME }}" --password-stdin
          
          # 기존 실행 중인 컨테이너 중지 및 삭제
          docker stop demo-app || true
          docker rm demo-app || true
          
          # 최신 이미지 Pull
          docker pull ${{ env.DOCKER_USERNAME }}/demo-app:latest
          
          # 새 컨테이너 백그라운드 실행 (8080 포트 포워딩 + 동일 도커 네트워크 묶기)
          docker run -d --name demo-app --network board-network -p 8080:8080 ${{ env.DOCKER_USERNAME }}/demo-app:latest
          
          # 사용되지 않는 이전 이미지 정리
          docker image prune -f
